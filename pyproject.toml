[project]
name = "cvztte"
version = "3.0.0"
description = "CV-ZTTE — Cryptographically Verifiable Zero-Trust Agentic Security Control Plane (reference implementation)"
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cvztte*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
pythonpath = [".", "tests/adversarial"]
markers = [
    "slow: end-to-end tests that build/run heavy artifacts (e.g. EZKL proving)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
